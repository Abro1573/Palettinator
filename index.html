<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft Color Engine (GitHub Data)</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    margin: 0;
    padding: 20px;
}

h1 { margin-bottom: 10px; }

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.tab {
    padding: 10px;
    background: #222;
    cursor: pointer;
    border-radius: 6px;
}

.tab.active { background: #444; }

.panel { display: none; }
.panel.active { display: block; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
}

.block {
    background: #222;
    padding: 10px;
    border-radius: 8px;
}

.swatch {
    width: 100%;
    height: 40px;
    border-radius: 6px;
    margin-bottom: 5px;
}
</style>
</head>

<body>

<h1>🧱 Minecraft Color Engine (Live GitHub Data)</h1>

<div class="tabs">
    <div class="tab active" onclick="switchTab(0)">Block Finder</div>
    <div class="tab" onclick="switchTab(1)">Gradient Tool</div>
</div>

<!-- FINDER -->
<div class="panel active">
    <input type="color" id="picker">
    <div id="results" class="grid"></div>
</div>

<!-- GRADIENT -->
<div class="panel">

    <h3>Gradient Tool</h3>

    <label>Start Block</label>
    <select id="start"></select>

    <label>End Block</label>
    <select id="end"></select>

    <label>Steps: <span id="stepLabel">5</span></label>
    <input type="range" min="2" max="20" value="5" id="steps">

    <div id="gradient" class="grid"></div>
</div>

<script>

// 🌐 REAL DATA FROM GITHUB
const DATA_URL =
"https://raw.githubusercontent.com/Pikacnu/mc-color-data/v1/1.21.7/blocks/data.min.json";

let blocks = {}; // will be loaded dynamically

// ================= COLOR MATH =================
function dist(a,b){
    return Math.sqrt(
        (a[0]-b[0])**2 +
        (a[1]-b[1])**2 +
        (a[2]-b[2])**2
    );
}

function hexToRgb(hex){
    hex = hex.replace("#","");
    return [
        parseInt(hex.slice(0,2),16),
        parseInt(hex.slice(2,4),16),
        parseInt(hex.slice(4,6),16)
    ];
}

function lerp(a,b,t){
    return [
        a[0] + (b[0]-a[0])*t,
        a[1] + (b[1]-a[1])*t,
        a[2] + (b[2]-a[2])*t
    ];
}

function closest(rgb){
    let best=null;
    let bestD=1e9;

    for(let name in blocks){
        let d = dist(rgb, blocks[name]);
        if(d < bestD){
            bestD = d;
            best = name;
        }
    }
    return best;
}

// ================= FINDER =================
function updateFinder(){
    let rgb = hexToRgb(picker.value);

    let sorted = Object.entries(blocks)
        .map(([name, c]) => ({
            name,
            rgb:c,
            score: dist(rgb,c)
        }))
        .sort((a,b)=>a.score-b.score);

    results.innerHTML="";

    sorted.slice(0,30).forEach(b=>{
        let div=document.createElement("div");
        div.className="block";

        div.innerHTML=`
            <div class="swatch" style="background:rgb(${b.rgb})"></div>
            <b>${b.name.replace("minecraft:","")}</b><br>
            ${Math.round(b.score)}
        `;

        results.appendChild(div);
    });
}

// ================= GRADIENT =================
function updateGradient(){

    let a = blocks[start.value];
    let b = blocks[end.value];
    let steps = +document.getElementById("steps").value;

    stepLabel.innerText = steps;

    gradient.innerHTML="";

    for(let i=0;i<steps;i++){
        let t = i/(steps-1);
        let rgb = lerp(a,b,t);
        let match = closest(rgb);

        let div=document.createElement("div");
        div.className="block";

        div.innerHTML=`
            <div class="swatch" style="background:rgb(${blocks[match]})"></div>
            <b>${match.replace("minecraft:","")}</b>
        `;

        gradient.appendChild(div);
    }
}

// ================= TABS =================
function switchTab(i){
    document.querySelectorAll(".tab").forEach((t,idx)=>{
        t.classList.toggle("active", idx===i);
    });

    document.querySelectorAll(".panel").forEach((p,idx)=>{
        p.classList.toggle("active", idx===i);
    });
}

// ================= LOAD DATA =================
async function load(){
    const res = await fetch(DATA_URL);
    const json = await res.json();

    // convert into simple map: name -> rgb
    for(let id in json){
        blocks[id] = json[id].color;
    }

    // populate dropdowns
    for(let name in blocks){
        start.innerHTML += `<option>${name}</option>`;
        end.innerHTML += `<option>${name}</option>`;
    }

    picker.oninput = updateFinder;
    start.onchange = updateGradient;
    end.onchange = updateGradient;
    steps.oninput = updateGradient;

    updateFinder();
    updateGradient();
}

load();
</script>

</body>
</html>
