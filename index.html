<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft Color Engine FIXED</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    margin: 0;
    padding: 20px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.tab {
    padding: 10px;
    background: #222;
    cursor: pointer;
    border-radius: 6px;
}

.tab.active { background: #444; }

.panel { display: none; }
.panel.active { display: block; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
}

.block {
    background: #222;
    padding: 10px;
    border-radius: 8px;
}

.swatch {
    width: 100%;
    height: 40px;
    border-radius: 6px;
    margin-bottom: 5px;
}
</style>
</head>

<body>

<h1>🧱 Minecraft Color Engine (FIXED)</h1>

<div class="tabs">
    <div class="tab active" onclick="switchTab(0)">Finder</div>
    <div class="tab" onclick="switchTab(1)">Gradient</div>
</div>

<div class="panel active">
    <input type="color" id="picker">
    <div id="results" class="grid"></div>
</div>

<div class="panel">

    <label>Start</label>
    <select id="start"></select>

    <label>End</label>
    <select id="end"></select>

    <label>Steps: <span id="stepLabel">5</span></label>
    <input type="range" min="2" max="20" value="5" id="steps">

    <div id="gradient" class="grid"></div>
</div>

<script>

const DATA_URL =
"https://raw.githubusercontent.com/Pikacnu/mc-color-data/v1/1.21.7/blocks/data.min.json";

let blocks = {};

// ---------- math ----------
function dist(a,b){
    return Math.sqrt(
        (a[0]-b[0])**2 +
        (a[1]-b[1])**2 +
        (a[2]-b[2])**2
    );
}

function lerp(a,b,t){
    return [
        a[0] + (b[0]-a[0])*t,
        a[1] + (b[1]-a[1])*t,
        a[2] + (b[2]-a[2])*t
    ];
}

// ---------- normalize dataset ----------
function parseBlocks(json){
    let out = {};

    for (let id in json) {
        let v = json[id];

        // FORMAT A: {color:[r,g,b]}
        if (Array.isArray(v)) {
            out[id] = v;
        }

        // FORMAT B: {color:[r,g,b]}
        else if (v.color) {
            out[id] = v.color;
        }
    }

    return out;
}

// ---------- closest ----------
function closest(rgb){
    let best=null;
    let bestD=1e9;

    for(let name in blocks){
        let d = dist(rgb, blocks[name]);
        if(d < bestD){
            bestD = d;
            best = name;
        }
    }
    return best;
}

// ---------- UI ----------
function updateFinder(){
    if(!Object.keys(blocks).length) return;

    let rgb = hexToRgb(picker.value);

    let sorted = Object.entries(blocks)
        .map(([name,c])=>({
            name,
            rgb:c,
            score:dist(rgb,c)
        }))
        .sort((a,b)=>a.score-b.score)
        .slice(0,30);

    results.innerHTML="";

    sorted.forEach(b=>{
        let div=document.createElement("div");
        div.className="block";

        div.innerHTML=`
            <div class="swatch" style="background:rgb(${b.rgb})"></div>
            <b>${b.name}</b>
        `;

        results.appendChild(div);
    });
}

function updateGradient(){
    if(!Object.keys(blocks).length) return;

    let a = blocks[start.value];
    let b = blocks[end.value];
    let steps = +stepsInput.value;

    stepLabel.innerText = steps;
    gradient.innerHTML="";

    for(let i=0;i<steps;i++){
        let t=i/(steps-1);
        let rgb=lerp(a,b,t);
        let match=closest(rgb);

        let div=document.createElement("div");
        div.className="block";

        div.innerHTML=`
            <div class="swatch" style="background:rgb(${blocks[match]})"></div>
            <b>${match}</b>
        `;

        gradient.appendChild(div);
    }
}

// ---------- helpers ----------
function hexToRgb(hex){
    hex=hex.replace("#","");
    return [
        parseInt(hex.slice(0,2),16),
        parseInt(hex.slice(2,4),16),
        parseInt(hex.slice(4,6),16)
    ];
}

// ---------- tabs ----------
function switchTab(i){
    document.querySelectorAll(".tab").forEach((t,idx)=>{
        t.classList.toggle("active", idx===i);
    });

    document.querySelectorAll(".panel").forEach((p,idx)=>{
        p.classList.toggle("active", idx===i);
    });
}

// ---------- load data ----------
async function load(){
    try {
        const res = await fetch(DATA_URL);
        const json = await res.json();

        blocks = parseBlocks(json);

        console.log("Loaded blocks:", Object.keys(blocks).length);

        for(let name in blocks){
            start.innerHTML += `<option>${name}</option>`;
            end.innerHTML += `<option>${name}</option>`;
        }

        picker.oninput = updateFinder;
        start.onchange = updateGradient;
        end.onchange = updateGradient;
        stepsInput.oninput = updateGradient;

        updateFinder();
        updateGradient();

    } catch (e) {
        console.error("Failed to load dataset:", e);
        results.innerHTML = "❌ Failed to load GitHub dataset (check console)";
    }
}

let stepsInput = document.getElementById("steps");

load();

</script>

</body>
</html>
