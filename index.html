<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft Color Engine (ROBUST)</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    margin: 0;
    padding: 20px;
}

.tabs { display:flex; gap:10px; margin-bottom:15px; }
.tab { padding:10px; background:#222; cursor:pointer; border-radius:6px; }
.tab.active { background:#444; }

.panel { display:none; }
.panel.active { display:block; }

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px;
}

.block {
    background:#222;
    padding:10px;
    border-radius:8px;
}

.swatch {
    width:100%;
    height:40px;
    border-radius:6px;
    margin-bottom:5px;
}
</style>
</head>

<body>

<h1>🧱 Minecraft Color Engine (FIXED FOR REAL)</h1>

<div class="tabs">
    <div class="tab active" onclick="switchTab(0)">Finder</div>
    <div class="tab" onclick="switchTab(1)">Gradient</div>
</div>

<div class="panel active">
    <input type="color" id="picker">
    <div id="results" class="grid"></div>
</div>

<div class="panel">

    <label>Start</label>
    <select id="start"></select>

    <label>End</label>
    <select id="end"></select>

    <label>Steps: <span id="stepLabel">5</span></label>
    <input type="range" id="steps" min="2" max="20" value="5">

    <div id="gradient" class="grid"></div>
</div>

<script>

const DATA_URL =
"https://raw.githubusercontent.com/Pikacnu/mc-color-data/v1/1.21.7/blocks/data.min.json";

let blocks = {};

// ---------------- COLOR ----------------
function dist(a,b){
    return Math.sqrt(
        (a[0]-b[0])**2 +
        (a[1]-b[1])**2 +
        (a[2]-b[2])**2
    );
}

function lerp(a,b,t){
    return [
        a[0] + (b[0]-a[0])*t,
        a[1] + (b[1]-a[1])*t,
        a[2] + (b[2]-a[2])*t
    ];
}

function hexToRgb(h){
    h=h.replace("#","");
    return [
        parseInt(h.slice(0,2),16),
        parseInt(h.slice(2,4),16),
        parseInt(h.slice(4,6),16)
    ];
}

// ---------------- NORMALISATION ENGINE ----------------
function normalize(json){

    const out = {};

    // CASE 1: array format
    if (Array.isArray(json)) {
        console.log("FORMAT: array");
        for (const item of json) {
            if (item?.name && item?.color) {
                out[item.name] = item.color;
            }
        }
        return out;
    }

    // CASE 2: object map format
    if (typeof json === "object") {

        // CASE 2a: wrapped under data
        if (json.data) json = json.data;

        console.log("FORMAT: object map");

        for (const key in json) {

            const v = json[key];

            if (Array.isArray(v)) {
                out[key] = v;
            }

            else if (v?.color) {
                out[key] = v.color;
            }

            else if (typeof v === "object") {
                // fallback deep scan
                if (Array.isArray(v.rgb)) out[key] = v.rgb;
                if (Array.isArray(v.colour)) out[key] = v.colour;
            }
        }
    }

    return out;
}

// ---------------- CLOSEST ----------------
function closest(rgb){
    let best=null, bestD=1e9;

    for (let k in blocks){
        let d = dist(rgb, blocks[k]);
        if (d < bestD){
            bestD = d;
            best = k;
        }
    }
    return best;
}

// ---------------- UI ----------------
function updateFinder(){
    if (!Object.keys(blocks).length) return;

    const rgb = hexToRgb(picker.value);

    const sorted = Object.entries(blocks)
        .map(([name,c])=>({
            name,
            rgb:c,
            score:dist(rgb,c)
        }))
        .sort((a,b)=>a.score-b.score)
        .slice(0,30);

    results.innerHTML = "";

    for (const b of sorted){
        const el = document.createElement("div");
        el.className="block";
        el.innerHTML = `
            <div class="swatch" style="background:rgb(${b.rgb})"></div>
            <b>${b.name}</b>
        `;
        results.appendChild(el);
    }
}

// ---------------- GRADIENT ----------------
function updateGradient(){

    if (!Object.keys(blocks).length) return;

    const a = blocks[start.value];
    const b = blocks[end.value];
    const steps = +document.getElementById("steps").value;

    stepLabel.innerText = steps;
    gradient.innerHTML = "";

    for (let i=0;i<steps;i++){

        const t = i/(steps-1);
        const rgb = lerp(a,b,t);
        const match = closest(rgb);

        const el = document.createElement("div");
        el.className="block";

        el.innerHTML = `
            <div class="swatch" style="background:rgb(${blocks[match]})"></div>
            <b>${match}</b>
        `;

        gradient.appendChild(el);
    }
}

// ---------------- TABS ----------------
function switchTab(i){
    document.querySelectorAll(".tab").forEach((t,idx)=>{
        t.classList.toggle("active", idx===i);
    });

    document.querySelectorAll(".panel").forEach((p,idx)=>{
        p.classList.toggle("active", idx===i);
    });
}

// ---------------- LOAD ----------------
async function load(){

    console.log("Fetching dataset...");

    const res = await fetch(DATA_URL);
    const json = await res.json();

    console.log("RAW TYPE:", typeof json);
    console.log("RAW SAMPLE:", json);

    blocks = normalize(json);

    console.log("BLOCK COUNT:", Object.keys(blocks).length);

    if (Object.keys(blocks).length === 0){
        throw new Error("Dataset parsed to 0 blocks — format mismatch");
    }

    for (let k in blocks){
        start.innerHTML += `<option>${k}</option>`;
        end.innerHTML += `<option>${k}</option>`;
    }

    picker.oninput = updateFinder;
    start.onchange = updateGradient;
    end.onchange = updateGradient;
    steps.oninput = updateGradient;

    updateFinder();
    updateGradient();
}

load();

</script>

</body>
</html>
